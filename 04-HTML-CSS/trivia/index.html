<!DOCTYPE html>
<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            function corchecker(correct, element) {
                if (correct) {
                    document.getElementById(element).innerHTML = "Correct! ✅";
                } else {
                    document.getElementById(element).innerHTML = "Incorrect ❌";
                }
            }

            function resetBtn() {
                var btns = document.querySelectorAll(".button");
                btns.forEach(function (btn) {
                    btn.classList.remove('incorrect');
                    btn.classList.remove('correct');
                });
            }

            function answerGet(event) {
                resetBtn();
                if (event.target.id === "correct") {
                    event.target.classList.add('correct');
                    corchecker(true, "mltc");
                } else {
                    event.target.classList.add('incorrect');
                    corchecker(false, "mltc");
                }
            }

            document.addEventListener("DOMContentLoaded", function () {
                var btns = document.querySelectorAll(".button");
                btns.forEach(function (btn) {
                    btn.addEventListener("click", answerGet);
                });

                var inputField = document.querySelector('input');
                var checkButton = document.querySelector("#check");

                checkButton.addEventListener('click', function () {
                    // Corrected logic for free response
                    if (inputField.value.toLowerCase() === "aref tavassoli") {
                        corchecker(true, "frre");
                    } else {
                        corchecker(false, "frre");
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>Who is the best programming teacher in the world?</h3>
                <h2 id="mltc"></h2>
                <button class="button">Ken Goldberg</button>
                <button class="button">Lake Hamilton</button>
                <button id="correct" class="button">David j. Malan</button>
                <button class="button">Alex Halderman</button>
                <button class="button">Jonathan Katz</button>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>Do you know who is the teacher of CS50x Tehran which is the largest cs50x in the world?</h3>
                <h2 id="frre"></h2>
                <input type="text">
                <button id="check" class="input">Check!</button>
            </div>
        </div>
    </body>
</html>
